# The frozen evaluation layer.
#
# This file answers HOW a score is computed. What a method receives and what it is scored
# against is the input layer, frozen separately in ../manifest.yaml and ../frozen.json.
# The two were one file until 2026-08-24; the coupling meant an unfinished null blocked a
# finished input layer. Keep them apart.
#
# The argument for every value here is in README.md, and its literature basis is in
# ../evidence/evaluation-metrics.md. Nothing in this file may be chosen or changed after a
# method has been scored: a threshold picked with results in hand is a hyperparameter.
#
#   uv run allo evaluate freeze     # re-derive frozen.json (needs the `eval` extra)
#   uv run allo evaluate verify     # offline: everything except the pockets
#
version: 4
frozen_on: 2026-09-03 # v4: negative class (b) also scores the label set. ADR 0038, 0039
# v3: 2026-09-02, the organisers' Q4 answer and that day's audit. ADR 0030, 0032
source: CHALLENGE.md section 4.1 (success criterion) and section 5 (scored artifact)
seed: 0

# ---------------------------------------------------------------------------------------
# The graph the evaluation uses. NOT the graph a method uses.
#
# A method's cutoff, weighting and node representation are hyperparameters, chosen on the
# secondary set's `development` tier. This graph never moves, so two methods' p-values are
# computed against the same geometry and are therefore comparable.
# ---------------------------------------------------------------------------------------
graph:
  atoms: heavy
  distance: minimum
  cutoff_angstrom: from_input_layer # ../manifest.yaml -> defaults.contact_cutoff_angstrom

# ---------------------------------------------------------------------------------------
# Endpoints.
#
# The confirmatory statistic is the mean midrank of the scoreable label set. With the
# positive-class size held fixed -- which every null below does by construction -- it is a
# strictly increasing function of AUC-ROC, so the permutation p-value is identical and the
# reported effect size is the metric this field actually uses.
#
# AUC-PR is reported, not tested, and that is a correction to the earlier draft. Two
# independent reasons: it is about three times noisier than AUC-ROC in the one paper that
# reports both with dispersion (PocketMiner, 0.44 +/- 0.12 against 0.83 +/- 0.04,
# doi:10.1038/s41467-023-36699-3), and at an effective sample size near 5 the noisier
# statistic cannot carry a confirmatory decision. It is reported because prevalence spans
# 6.79x across the frozen arms and AUC-ROC hides that: on one dataset with one split,
# AllositePro reads AUROC 0.68 with AUPRC 0.07 while PASSerRank reads 0.82 and 0.46
# (Allo-Allo, doi:10.1101/2024.09.28.615583). Always print it against its chance line,
# which is the prevalence, because AUPRC favours higher-prevalence arms
# (McDermott et al., arXiv:2401.06091).
# ---------------------------------------------------------------------------------------
endpoints:
  top_k: 5 # CHALLENGE.md section 5: the scored artifact is a top-5 residue list
  confirmatory: mean_rank
  reported:
    - auc_roc
    - auc_pr
    - precision_at_5
    - hits_at_5
    - recall_at_5
    # Distance in angstrom from the centre of the predicted top-5 to the centre of the site.
    # The one published criterion built for a residue list rather than a pocket (STINGAllo,
    # doi:10.1093/bib/bbaf424). Reported as a DISTANCE, never as a success rate: the usual
    # 4 A threshold is contested for centre-to-centre use, and LIGYSIS-bench measured it and
    # says 10-12 A is the comparable figure. Freezing either number takes a side, so the
    # continuous distance is frozen and both conventions print beside it.
    #
    # It is not redundant with the p-value, and one measurement shows why. On
    # cardiac_myosin_corrected the cavity-volume baseline rejects the confirmatory null at
    # p_calibrated 0.0046 while its top five hold no label and its predicted centre sits no
    # closer to the true site than chance: DCC 26.14 A against a chance line of 28.73 A. A
    # confirmatory rejection and a useful hit list are not the same claim. ADR 0025.
    #
    # CORRECTED 2026-09-03. This ran on bcr_abl1_corrected at 0.0003 and 26.5 A against
    # 17.7 A, which are version-2 numbers. That arm reads 0.3236 under version 3 and rejects
    # nothing, so the example was withdrawn by README section 13 and never replaced here.
    - dcc_angstrom
    - auc_roc_vs_decoy_linings
    # ADDED AT v4. ADR 0039. The same permutation as `decoy_pockets.p`, with the LABEL SET as
    # the positive instead of the detector's site-pocket lining. It is reported beside `p`
    # and never in place of it.
    #
    # `p` asks whether the method ranks the true POCKET above decoy pockets, which is a fair
    # reading of section 4.1 and is what review 25 section 1.4 froze, because the two halves
    # are then exchangeable. Measured on the real linings and the real coordinates, at 20 000
    # fields per arm, it has no power against the thing the challenge is about: a delta = 4
    # shift on every label residue gives power 0 on kras and on cardiac myosin, and 0.037 on
    # bcr-abl1. The dilution is mechanical -- 12 myosin labels inside a 295-residue lining
    # move the lining mean by 12/295 of delta -- and delta = 2 already means a mean per-arm
    # AUC of 0.93, so this is not a small-effect artefact.
    #
    # `label_p` asks whether the method ranks the ALLOSTERIC RESIDUES above decoy pockets.
    # Same instrument, same fields: power 0.754 and 0.875 at delta = 2, 0.999 and 1.000 at
    # delta = 4 on bcr-abl1 and cardiac myosin.
    #
    # It is a DESCRIPTIVE PERCENTILE and NOT a p-value. Review 25 section 1.4 removed this
    # form because no measured type-I rate covered it, and the first version of this entry
    # said the measurement showed it "conservative, never anti-conservative". That was
    # inferred from one null family and it is false. Over four generators in
    # `../../../experiments/2026-09-03-endpoint-b/` its size runs 0.0000 to 0.0548, and on
    # bcr_abl1_corrected under a blocky distance-monotone field -- the shape every
    # distance-correlated baseline here has -- the worst cell's 95 % interval is
    # [0.0516, 0.0580], entirely above alpha. The `p` above holds on all four, worst cell
    # 0.0237, so review 25's exchangeability argument is vindicated by measurement.
    #
    # Quote it as "the label set outranks N of M detected pockets". Never as a p-value.
    #
    # kras_g12c_corrected cannot reject on either form: 18 decoys floor the attainable p at
    # 1/19 = 0.0526. That is the detector's count, not the statistic.
    #
    # Descriptive, like `p`. Neither enters a confirmatory family.
    - label_rank_vs_decoy_linings
  omitted:
    accuracy: >-
      At 1.6-11 % prevalence, answering "not a label" for every residue scores 0.89-0.98, so
      accuracy measures the negative class and nothing else. Arithmetic, not a citation. The
      Allo-Allo Table 1 illustration (0.91-0.98 for every method, including one at AUPRC 0.07)
      is read from a bitmap table and is not independently verified.
    mcc_and_f1: >-
      The threshold is fixed at k = 5 by CHALLENGE.md section 5, so MCC and F1 are computable
      here and the objection is a ceiling rather than a missing threshold. At a fixed-size-k
      predictor the exact maximum is sqrt(k(n-p)/(p(n-k))), which runs 0.500-0.645 over the
      five primary arms as they stood at v2 -- so a perfect top-5 scores about 0.6, and the
      number cannot be compared to any published MCC computed at a free threshold. Reported
      nowhere for that reason. The `sqrt(k/p)` shorthand overstates the ceiling by up to
      4.1 %; use the exact form. CORRECTED at v3: v2 quoted Utges & Barton
      (doi:10.1186/s13321-024-00923-z) as the argument, and the layer's own AUDIT.md withdrew
      that reading. The paper's sentence is about residue-level metrics in general, not about
      a fixed-k ceiling.
    jaccard: >-
      Reported nowhere because its ceiling is arm-dependent and low, not because it is
      unreachable. CORRECTED at v3: v2 said "caps at about 0.31". The measured cap is 0.4545,
      on a 5-residue list against an 11-residue label set. Both numbers sit below AlloBench's
      0.5 reporting threshold, so the disposition is unchanged and the stated number was
      wrong.
    dvo: >-
      No volume is predicted, so there is nothing to overlap. CORRECTED at v3: v2 carried a
      second clause that the layer's own AUDIT.md called false, about no standard threshold
      existing. DeepSite and Kalasanty both report DVO at a stated convention. The first
      clause alone is the reason.
    enrichment_factor_bedroc_rie: >-
      Not used anywhere in site prediction; both literature sweeps found zero instances.
      BEDROC alpha = 20 encodes "the top 8 % matters", which is meaningless at k = 5.
    top_5_fragmentation: >-
      NOT omitted at v3 -- added. See `reported` above. CHALLENGE.md section 4.2 asks for
      actionable output, and nothing measured whether the five predicted residues are one
      place or five. Published precedent: Seq2Pocket's Pocket Fragmentation Index
      (doi:10.64898/2026.01.28.702257), which "measures the average number of predicted
      clusters assigned to each ground-truth pocket", ideal 1.0. Ours is the count of
      connected components the top-5 induces in the evaluation graph, 1 to 5.

# ---------------------------------------------------------------------------------------
# Nulls. CHALLENGE.md section 4.1 names two negative classes; the first is split into the
# form the challenge words and the form that holds its size.
# ---------------------------------------------------------------------------------------
nulls:
  replicates: 9999

  # (a) as worded. Reported, never confirmatory: measured type-I rate 0.096-0.323 against a
  # nominal 0.05, because label sets are contiguous patches and these replicates are not.
  background_residues:
    kind: uniform_residue_permutation

  # (a) in the form that holds its size. THE CONFIRMATORY NULL.
  matched_patch:
    kind: matched_patch_permutation
    match: [size, components, mean_degree, radius_of_gyration]
    tolerance: 0.10 # one relative bound on mean degree and on radius of gyration
    freeze_probe_patches: 200 # what `verify` re-draws to check the geometry has not moved
    # v3 re-runs the calibration. The 2026-09-02 input re-freeze moved bcr_abl1_mandated
    # from 1OPL chain A to chain B (ADR 0029) and exposed cardiac_myosin_mandated for the
    # first time (ADR 0031), so the v2 gate is stale on one arm and absent on the other. The
    # config differs from 2026-08-25 only in the arm list; every unchanged arm reproduces its
    # v2 value.
    calibrated_by: experiments/2026-09-02-null-recalibration
    # Matching those four properties is not enough on every arm. Radius of gyration is the
    # second moment of the patch about its centroid, and what sets the variance of a patch
    # mean under a spatially autocorrelated score is the whole within-patch distance
    # distribution. The residual is measurable: type-I 0.059-0.075 on the two BCR-ABL1 arms
    # and 0.034-0.037 on cardiac myosin, against a nominal 0.05. No moment tested closes it,
    # and matching the variance factor itself is impossible in advance, because it depends
    # on the *method's* correlation length.
    #
    # So the threshold is calibrated rather than the null matched further, and the rescale is
    # on the PROBIT scale. The observed statistic's null is `size_ratio` times as wide as the
    # pool members', and `score_arm` reports
    #
    #     p_calibrated = max(p, sf(isf(p) / size_ratio))
    #
    # which is the value the decision and the Holm step-down use.
    #
    # `size_ratio` is calibrated at EVERY level Holm can present -- alpha/3, alpha/2, alpha --
    # and not only at alpha. A one-parameter rescale fitted at one threshold is wrong at the
    # others: the draft's linear `p * alpha / alpha_star` ran above nominal at the tighter
    # steps and the composed procedure leaked FWER. The rescale is conservative at level t
    # exactly when the ratio is at least z(q_t)/z(t), so taking the maximum over all three
    # levels and all four correlation lengths is conservative at all of them by construction.
    #
    # Three one-sided choices, every one toward a smaller test: the maximum over correlation
    # lengths, the maximum over Holm levels, and a floor at 1. Calibration may tighten a test
    # and may never loosen one, so an arm already conservative keeps the nominal threshold
    # instead of buying power back. Taking a maximum over twelve noisy quantiles biases the
    # ratio upward, which costs power and never costs size. Frozen per arm in frozen.json,
    # beside the `alpha_star` the linear rescale used, which is kept for disclosure. ADR 0025.
    size_calibration: size_ratio, per arm, from the experiment named above

  # (a) plus the confound this sub-field names "distance bias"
  # (ProteinLens, doi:10.1093/nar/gkab350). Pre-registered secondary, reported always.
  matched_patch_distance:
    kind: matched_patch_permutation
    match:
      [
        size,
        components,
        mean_degree,
        radius_of_gyration,
        median_distance_to_source,
      ]
    # Fewer replicates than the confirmatory null, deliberately. Five simultaneous matched
    # properties drop the acceptance rate to 0.0018 on the myosin arm, and a secondary
    # endpoint does not need a p-value floor below 5e-4.
    replicates: 1999

  # (b) non-functional surface pockets, as CHALLENGE.md section 4.1 words it.
  #
  # PER ARM THIS CANNOT CARRY A DECISION, AND THAT IS STRUCTURAL, NOT A DETECTOR PROBLEM.
  # The statistic is one draw per pocket, so all within-pocket information is discarded and
  # the power tends to 1 - Phi(z_(1-alpha) - delta). Eighty per cent power therefore needs a
  # CORRECTED 2026-09-02: 2.487 is the n -> infinity NORMAL-QUANTILE limit, not the power of the discrete rank test the code runs. Integrating the exact binomial mixture at alpha = 0.05 gives power 0.7173 at 19 decoys, 0.6530 at 31, 0.7718 at 84, 0.7888 at 139 and only 0.7959 at 400 -- and rejection is IMPOSSIBLE at 18 or fewer. The direction is that the test is WEAKER than 2.487 implies at every frozen decoy count, so the disclosed floor understates the effect the test needs.
  # pocket-level effect of delta >= z_0.95 + z_0.80 = 2.487 standard deviations AT ANY DECOY
  # COUNT. Two replacements were measured against the ADR 0018 type-I gate before either was
  # recommended: a residue-level rank test reads 0.132-0.384, worse than the unmatched null
  # this protocol already rejects; and a size-matched patch inside the decoy union cannot be
  # drawn, because on both KRAS arms no decoy pocket is as large as the label set. ADR 0030.
  decoy_pockets:
    kind: pocket_rank_permutation
    statistic: mean midrank of the lining residues
    confirmatory: false

  # (b) in the form that can reject. Fisher and Stouffer are unbounded below even when every
  # input is floored, so a combination across arms escapes the 1/(1 + n_decoys) floor that
  # binds each arm. Minimum attainable p on the three confirmatory arms, re-derived
  # 2026-09-02 at the settings below: Fisher 0.00137, Stouffer 0.000453. At the v2 settings
  # the same quantities were 0.0214 and 0.0115.
  #
  # LABEL IT CORRECTLY WHEREVER IT IS QUOTED. Fisher and Stouffer test the INTERSECTION null
  # -- no arm has signal -- so a rejection licenses "at least one arm separates the site from
  # non-functional surface pockets". It is not a generalisation claim. `allo.scoring.harness
  # .combine_arms` is the one implementation. ADR 0030.
  decoy_pockets_combined:
    kind: across_arm_combination
    combine: fisher
    also_reported: stouffer
    over: confirmatory_family
    tests: intersection null

decoys:
  detector: pyKVFinder
  detector_version: 0.9.3 # asserted in allo.scoring.decoys.detect_pockets
  detector_doi: 10.1186/s12859-021-04519-4
  # The package's documented defaults for version 0.9.3, written out. The cited paper states
  # none of the five values, so `detector_version` above is the citation for them. Choosing
  # the defaults is the choice not to tune a detector on the benchmark it will score.
  # RE-FROZEN AT v3, SELECTING ON `n_detected` ALONE. The organisers answered on 2026-09-02
  # that no detector is prescribed and that each team designs its own decoy set, which
  # removed the reason to treat the v2 floor as fixed.
  #
  # CORRECTED 2026-09-02. This block used to say `n_decoys` is label-free. It is not.
  # `allo.scoring.decoys.classify` picks the site pocket by maximum label coverage and
  # admits a pocket as a decoy only when its lining holds no label and clears the halo, so
  # the count is a function of the label set. The criterion that IS label-free is
  # `n_detected`, the number of pockets the detector returns before any label is consulted.
  # It selects `po 8 rd1.2 vol1` on all five arms in `../review/data/decoy-power-sweep.json`,
  # with no tie, which is the same setting `n_decoys` selects. The freeze does not move; the
  # sentence justifying it was wrong and the criterion of record is now `n_detected`.
  # Site coverage is reported as a CONSEQUENCE and was never the selection target: choosing
  # a setting because it covers more labels would do exactly what this rule forbids.
  #
  # Measured over five settings x all 15 arms on 2026-09-02. This setting is the maximum on
  # `n_decoys` for every arm, with no tie: total 777 decoy pockets against 311 at the v2
  # defaults, median 45 against 16, and 12 of 15 arms at or above the 19 decoys a per-arm
  # rejection at alpha would need, against 7 of 15.
  #
  # It also repairs a reporting defect that is independent of power. At the v2 settings the
  # pocket this protocol calls "the site" on bcr_abl1_corrected covered 0.667 of its label
  # set, so the field's pocket-rank convention was being applied to a pocket that was two
  # thirds of the site. It now covers 0.944. On bcr_abl1_mandated 0.647 -> 1.000, on
  # kras_g12c_corrected 0.750 -> 0.938, and the median over all arms 0.750 -> 0.917.
  #
  # WHAT IT DOES NOT FIX. kras_g12c_mandated reaches 13 decoys and mkp5 reaches 14, so
  # neither can reject per arm at any effect size. A 169-residue protein does not carry 19
  # non-functional surface pockets. That is arithmetic about small proteins and it is why
  # `decoy_pockets_combined` exists. ADR 0030.
  detector_settings:
    step: 0.6
    probe_in: 1.4
    probe_out: 8.0
    removal_distance: 1.2
    volume_cutoff: 1.0
  # A pocket is a decoy only if its lining shares no residue with the label set. The halo
  # is 0 because a larger one empties the class: at 5 A `kras_g12c_mandated` keeps zero
  # decoys and at 8 A both KRAS arms do. That is a property of a 169-residue protein with
  # five detectable pockets, and it is disclosed rather than engineered around.
  halo_angstrom: 0.0

# ---------------------------------------------------------------------------------------
# The decision rule. One confirmatory family, declared before any method exists.
# ---------------------------------------------------------------------------------------
decision:
  alpha: 0.05
  sided: upper
  # One-sided by design, not convenience: a method ranking allosteric residues BELOW
  # background is a broken method, not a competing finding.
  confirmatory_family:
    - kras_g12c_corrected
    - bcr_abl1_corrected
    - cardiac_myosin_corrected
  correction: holm

  # SECOND CONFIRMATORY FAMILY, ADDED AT v3. ADR 0032.
  #
  # ADR 0025 makes "beat cavity_volume" the claim threshold, because clearing the matched
  # patch null is a low bar: a label-blind, apo-only, zero-parameter geometric baseline
  # rejects on all three confirmatory arms. Section 8 of README.md then declared everything
  # except the matched-patch family descriptive. So the load-bearing comparison sat in a
  # family the protocol declared unprotected. That is an internal contradiction and this
  # closes it.
  #
  # The reference is `cavity_volume` and ONLY `cavity_volume`, pre-declared in ADR 0025, so
  # the family stays fixed at three by the arms rather than growing with the number of
  # methods a run happens to produce. Two-sided as `compare_methods` already is: between two
  # methods there is no asymmetry to exploit, and a prior on which one wins is the bias this
  # protocol exists to prevent.
  #
  # A method must clear BOTH families to support a claim. Every other baseline comparison is
  # descriptive.
  claim_family:
    test: compare_methods
    reference: cavity_volume
    arms:
      - kras_g12c_corrected
      - bcr_abl1_corrected
      - cardiac_myosin_corrected
    correction: holm
    sided: two
  # Why these three and not all six: the three `mandated` arms are the challenge's literal
  # assignment and are reported for that reason, but each shares a protein and a site with
  # its corrected arm, so including both would test one disease area twice. The corrected
  # arm is where methods are compared (CONTEXT.md, "Tier").
  #
  # CORRECTED 2026-09-02. This list held two arms and its comment said "the two mandated
  # arms" and "not all five", both written when the primary set had five arms and two
  # mandated ones. `cardiac_myosin_mandated` was frozen by ADR 0031 and never added, so it
  # was fully scored with no central reporting role -- its own manifest block says "reported
  # and NEVER confirmatory" and this file did not agree. Every primary arm now appears
  # exactly once across `confirmatory_family` and `supportive_only`.
  supportive_only:
    - kras_g12c_mandated
    - bcr_abl1_mandated
    - cardiac_myosin_mandated
  # Everything on the secondary set's `development` tier is tuning, never a decision.
  # The `generalisation` tier carries the one across-target claim and opens in Phase 5.
  across_target_claim: secondary/generalisation

# ---------------------------------------------------------------------------------------
# Endpoints for CHALLENGE.md section 4.2. Declared here for the same reason as everything
# above: chosen after seeing a result, each becomes a hyperparameter. Implementation belongs
# to Phases 3 and 4, the choice belongs here.
# ---------------------------------------------------------------------------------------
secondary_objectives:
  noise_resilience:
    quantity: stability of the RANKING, not of the raw metric
    statistics: [spearman_rho, kendall_tau, overlap_at_5, jaccard_at_5]
    # All four together, following the only precedent that reports them
    # (arXiv:2604.17486). Rank-biased overlap is omitted, and the reason changed at v3: v2
    # said it "has no use in this literature", which is a popularity argument and R1 forbids
    # one. The first-principles reason is that RBO's contribution is top-weighting
    # (doi:10.1145/1852102.1852106) and overlap@5 already carries it at exactly the k that
    # ships, so RBO adds nothing here. ADR 0032.
  coarse_graining:
    quantity: retention of the topological signal under compression
    statistics:
      [spectral_distance, spearman_rho_of_residue_scores, label_recovery_at_5]
    # Spectral rather than mode overlap. exp(-iHt) is a function of the spectrum alone,
    # and mode overlap needs a holo displacement vector, which C1 forbids on the prediction
    # path. Precedent for spectral coarse-graining of a walk on a graph:
    # Gfeller & De Los Rios, doi:10.1103/PhysRevLett.99.038701.
  classical_comparison:
    # Priority order. A method that does not beat the first three has demonstrated nothing.
    required_baselines:
      # Score every candidate by the volume of the largest detected pocket that lines it, 0
      # if none does. It uses no label and no network.
      #
      # RE-MEASURED AT v3, 2026-09-02. Under v2 it rejected on all three confirmatory arms
      # (p_calibrated 0.0047, 0.0001, 0.0001) and this block said so. Under v3 it rejects on
      # ONE of three: `p_calibrated` 0.0715 on `kras_g12c_corrected`, 0.3236 on
      # `bcr_abl1_corrected`, 0.0046 on `cardiac_myosin_corrected`, against Holm thresholds
      # 0.025, 0.05 and 0.016667.
      #
      # CORRECTED 2026-09-02. This block said the v3 input layer "moved bcr_abl1_corrected
      # to a different apo chain". It did not. ADR 0029 moved bcr_abl1_MANDATED to 1OPL:B
      # and says in its own title that 2G2H stays the comparison arm; bcr_abl1_corrected is
      # and was 2G2H:A. The cause is the DETECTOR re-freeze (ADR 0030): cavity_volume is
      # computed from the detector's own cavities, so re-freezing the decoys redefined the
      # baseline. Its median AUC runs 0.795 at the v2 defaults and 0.696 at the v3 settings.
      #
      # The v2 triple is DISPUTED and neither value has been re-derived: this block said
      # 0.0047 / 0.0001 / 0.0001 and README.md said 0.0073 / 0.0003 / 0.0001. Quote only the
      # v3 triple, which is measured. Derivation: `../review/21-protocol-v3-statistics.md`.
      #
      # The conclusion survives at reduced strength. A zero-parameter detector score still
      # clears the matched-patch null on one confirmatory arm, so a single rejection is not
      # evidence that a method learned anything about allostery. It is no longer true that
      # the baseline sweeps the family, and no document may say so. This baseline is what a
      # quantum result has to beat. It is also the field's own control:
      # "rank by detector score alone" is the reference both PASSer2.0
      # (doi:10.1093/nar/gkad303) and DeepAllo (doi:10.1093/bioinformatics/btaf294) report
      # against. Added at the version-2 audit; it was the first blocker. ADR 0025.
      - cavity_volume
      - distance_from_source_negated
      - distance_from_source
      - eigenvector_centrality
      - degree
      - closeness
      - betweenness
      - gnm_or_essa
      - perturbation_response_scanning
    also_report: spearman_rho between the method and every baseline on the same arm
    # What "beat" means. Until protocol version 2 this manifest required a method to beat its
    # baselines and defined no test for it, so the comparison rule would have been chosen with
    # results in hand -- a hyperparameter, exactly like a threshold. `allo.scoring.harness`
    # `compare_methods` is that rule, frozen before any method exists.
    #
    # Paired on the residue: take the difference of the two midrank vectors and test its mean
    # over the label patch against its mean over the same matched-patch pool the confirmatory
    # test uses. Pairing removes every property of the arm that acts on both scores alike, so
    # it is far more sensitive than comparing two separate p-values, and both methods face the
    # identical pool so a difference between them cannot be sampler noise.
    #
    # TWO-SIDED, unlike the confirmatory test. There the one-sided rule has an argument: a
    # method ranking allosteric residues below background is broken, not competing. Between two
    # methods there is no such asymmetry, and a prior on which one wins is the bias this
    # protocol exists to prevent. The null is centred on its own median before the tails count.
    #
    # It is not a formality. `cavity_volume` beats `distance_from_source_negated` by AUC-ROC
    # +0.24 on kras_g12c_corrected and the paired test reads p = 0.60: a gap that size is
    # inside what patch geometry produces on that arm. Comparing two AUC values would have
    # called it a win. ADR 0025.
    pairwise_test: matched_patch_paired_permutation, two-sided, calibrated by the arm's size_ratio

# ---------------------------------------------------------------------------------------
# How results are decomposed. Four factors, no more: at N <= 5 per cell no stratified
# comparison can support a test, so these organise reporting and never a decision.
# ---------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------
# Confounders. Not endpoints: one Spearman correlation each, between the method's score and a
# residue property it must not merely be re-measuring.
#
# The first question asked of any distal-site score is whether it is a burial proxy or a
# flexibility proxy under another name. Section 11 of README.md controls burial inside the
# null, which is the stronger treatment, but it leaves the reader with no number. These are
# that number, and they are printed beside every result so the question is answered before it
# is asked.
#
# Declared here and computed at score time, never frozen: a frozen value would be identical
# for every method and would say nothing about any of them. Already earning their keep --
# `distance_from_source_negated` correlates with normalised B-factor at rho = -0.79 on cardiac
# myosin, so a "propagation" score of that shape is largely re-measuring crystallographic
# disorder. ADR 0025.
# ---------------------------------------------------------------------------------------
confounders:
  relative_solvent_accessibility:
    source: Shrake-Rupley on the apo input, probe 1.4 A, Bondi radii
    normalised_by: theoretical maximum accessible area, Tien et al. doi:10.1371/journal.pone.0080635
  normalised_b_factor:
    source: the deposited isotropic B, per-residue mean, z-scored within the chain
    note: >-
      A measured property of the deposited structure, not a simulated trajectory, so C2
      permits it. Z-scored within the chain so arms refined at different resolutions compare.
  hydrophobicity:
    source: Kyte & Doolittle hydropathy, doi:10.1016/0022-2836(82)90515-0
  conservation:
    source: unknown
    note: >-
      Absent. It needs a multiple-sequence alignment against an external database, which the
      offline gate cannot carry. Recorded as unknown rather than approximated (R3). This is a
      disclosed gap: sequence conservation is the fourth property a reviewer will ask about.
      The METHOD is decided and the COLUMN is not built. ADR 0035 fixes it as Jensen-Shannon
      divergence in the Capra & Singh form (doi:10.1093/bioinformatics/btm270) against a
      BLOSUM62 background with Henikoff-Henikoff sequence weights and lambda = 1/2, with the
      window heuristic OFF, over Pfam 38.2 full alignments fetched from InterPro. What blocks
      it is artifact size, not method: PF07714 alone is 191 MB gzipped, so the pinned artifact
      has to become the derived per-residue column plus the alignment hash, never the
      alignment. Coevolution was considered and rejected as a category error, not deferred.
  # ADDED AT v3, and free -- the evaluation graph already holds both. They separate label from
  # background about as strongly as the three above: degree reaches AUC 0.770 on `ns5b` and
  # 0.751 on `mkp5`, distance reaches 0.932 on `hiv_rt` in its better direction
  # (`../review/12-dataset-eda.md`). Apo-only and label-free, so C1 and C2 are untouched.
  # Reported, never tested.
  degree:
    source: the evaluation graph's own node degree at the frozen 4.5 A heavy-atom cutoff
  distance_to_source:
    source: minimum Ca distance from the residue to any propagation-source residue
    note: >-
      Signed so that a LARGER value is FARTHER from the source. A propagation method is
      expected to correlate negatively; the column exists to say by how much.
  statistic: spearman_rho between the method's score and the property, over the candidate set

stratification:
  - crypticity # transplant clash fraction, frozen in ../frozen.json
  - proximity_to_source # min Ca distance, scoreable set; print the distance baseline beside it
  - tier # mandated against corrected
  - prevalence # a covariate, never a stratum
