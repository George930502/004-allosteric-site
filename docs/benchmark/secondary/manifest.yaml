# Secondary benchmark — the input layer for the generalisability and scalability claim.
#
# Same rules, same code, same freeze mechanics as `docs/benchmark/primary/manifest.yaml`. Reading
# that file first is the fastest way to understand this one; only what DIFFERS is explained
# here. Rationale: docs/adr/0021-secondary-benchmark-is-two-disjoint-sets.md.
# Clause-by-clause admission and the achieved statistics: docs/benchmark/secondary/README.md.
# Every candidate considered, and the clause that decided it: secondary/selection.json.
#
# CHALLENGE.md section 6 asks for additional targets that demonstrate generalizability and
# scalability. Three targets cannot make a cross-target claim at all: a distribution-free
# one-sample test over N targets has a minimum attainable one-sided p of 2^-N, which at
# N = 3 is 0.125. That is why this set exists.
#
# TWO TIERS, ONE FREEZE. Both tiers freeze now, from this file, through the same derive()
# the primary set uses — that is what makes their numbers comparable. They are LOOKED AT at
# different times, and that is what makes the second tier worth anything:
#   development     - every hyperparameter: metric, Hamiltonian, cutoff, ratio. Phase 2
#                     onward. Burned by construction, exactly as ADR 0012 says.
#   generalisation  - the generalisability and scalability claims. Phase 5, and NOT BEFORE
#                     the method is frozen. Reading it early destroys the only thing it is for.
# Tier assignment is a seeded, size-stratified split (ADR 0021 section 5), not a judgement.
# It is reproduced from n_residues by `allo.benchmark.size_stratified_split`, and a test
# holds that the recorded tiers are what that function returns. Nobody chose which targets
# carry the generalisation claim, so nobody could put the easy ones there.
#
# FOUR EXTRA ADMISSION CLAUSES bind this set and not the primary one, because they are
# SELECTION rules and a selection only exists where there is a pool (ADR 0009's reasoning):
#   (ix)  single-chain lining      - every lining residue in the modelled chain. Measured.
#   (x)   apo occupant classified  - a second-site occupant must contact NO label.
#   (xi)  structure admission      - ADR 0009: X-ray <= 2.5 A, cryo-EM <= 4.0 A.
#   (xii) within-set redundancy    - no shared Pfam family, inside this set or with the
#                                    primary set. `pfam:` on each target is what that is
#                                    checked against.
# Clauses (i)-(viii) in docs/benchmark/primary/README.md section 1 are unchanged and bind both sets.
#
# `pfam` is the only field here with no counterpart in the primary manifest. It is apo-side
# sequence annotation, it is redacted out of the prediction path like every other evaluation
# field, and it exists so clause (xii) is a test rather than a promise.

version: 1
frozen_on: 2026-08-24
source: CHALLENGE.md section 6 — additional targets of the participant's choice

defaults:
  # Identical to the primary set on purpose. A number from this set is comparable with a
  # number from that one only if every input-layer knob is the same.
  contact_cutoff_angstrom: 4.5
  cutoff_sensitivity: [4.0, 5.0]
  atom_selection: heavy
  model: 1


