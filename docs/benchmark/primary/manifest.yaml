# Frozen benchmark — the input layer, fixed.
#
# Every choice that decides what a method receives, and what it is scored against, lives
# here and nowhere else. `uv run allo benchmark verify` re-derives every consequence from
# the deposited files and fails if anything moved. The consequences land in `frozen.json`,
# which is generated and never hand-edited. Rationale: docs/benchmark/primary/README.md.
#
# HOW to score is a separate layer with a separate lifecycle. It is not in this file. See
# docs/benchmark/evaluation/ (manifest.yaml, frozen.json, README.md).
#
# One disease area from CHALLENGE.md Table 1 gives two arms:
#   mandated  - exactly the pair the challenge names, defects and all. `defect:` says what
#               is wrong with it. Reported because the challenge requires it.
#   corrected - the defensible pair for the same protein and the same site, pinned here
#               BEFORE any method exists, so the choice cannot be tuned to a result.
#
# active_site is a *rule*, not a residue list: {from_ligands: [...]} takes the apo entry's
# own cofactor contacts, {from_motifs: [...]} locates conserved catalytic motifs by
# sequence. Deriving it means `verify` checks it. A pinned list would only be compared
# against itself, and would be wrong the moment an entry uses another numbering convention,
# which the ABL1 entries do.

# `pfam` is apo-side family annotation, read from RCSB. It carries no consequence for
# this set and changes nothing the freeze derives. It exists so that the secondary set's
# clause (xii) -- no shared Pfam family with any primary target -- is a test rather than
# a promise. See docs/adr/0021-secondary-benchmark-is-two-disjoint-sets.md.

version: 2
frozen_on: 2026-08-24
source: CHALLENGE.md section 6, Table 1

defaults:
  # Pocket = protein residues with any heavy atom within cutoff of any ligand heavy atom.
  # Cutoff is the knob the field varies most (3.5-6 A across published benchmarks; see
  # README section 1). 4.5 A is the working value; 4.0 and 5.0 are frozen alongside it in
  # `labels_by_cutoff` so a later run cannot quietly report whichever cutoff flatters a
  # method.
  contact_cutoff_angstrom: 4.5
  cutoff_sensitivity: [4.0, 5.0]
  atom_selection: heavy
  model: 1

