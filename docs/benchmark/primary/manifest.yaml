# Only members of state_components can change the catalytic-state match. Additives are
# recorded separately. Every unclassified component touching a mapped active-site residue
# makes the freeze fail, so extending this vocabulary is a visible protocol change.
# ADR 0044. Two classes, and the annotation DECIDES NOTHING -- clause (iii) and clause (x)
# both count every non-water heteroatom through the name-blind `apo.ligand` mask at
# `src/allo/structure/pdb.py`, which is stricter than any roster below and consults none of
# this. `state_components` means the substrate, product, cofactor or ion the enzyme needs to
# be in this functional state. `additives` means present because of how the crystal was grown.
# There is no third class, because a scoped review on 2026-09-03 found none published: every
# instrument in the field is binary. The rule is per STRUCTURE with a cited roster, never per
# component in the abstract, because glycerol is a competitive inhibitor of glycogen
# phosphorylase at K_i 3.8 %% v/v (doi:10.1110/ps.8.4.741) and inert here. Where the deposition
# literature settles a case it decides; otherwise the default is BioLiP2's 463-identifier
# artifact list (doi:10.1093/nar/gkad630), the only published, distributed roster there is.
#
# No primary apo or holo active site contacts GOL, SO4 or CL -- the freeze proves it by
# existing, because the classifier raises on a contacting component that the vocabulary does
# not name. The three are declared here anyway, so that the two sets carry the same roster and
# an arm added later cannot be classed differently by accident (review 27 section 3.5).
orthosteric_vocabulary:
  state_components: [ADP, GDP, MG, NIL, P16, PO4]
  additives: [CL, GOL, SO4]

# ---------------------------------------------------------------------------------------
# Shared per-protein blocks. The mandated and the corrected arm of one disease area predict
# the SAME site with the SAME functional evidence, so the evidence is written once.
# ---------------------------------------------------------------------------------------

_kras_evidence: &kras_evidence
  doi: 10.1038/nature12796
  assay: >
    Ostrem 2013. Covalent S-IIP binding subverts native nucleotide preference (GTP->GDP,
    mant-dGDP competition) and impairs Raf binding (co-IP in two G12C lung lines) - a
    functional change at the nucleotide site and at the effector interface, driven from a
    pocket the compound body shares with neither. Do NOT argue this target by distance:
    5 of the 21 labels are active-site residues at 0.0 A.
    Caveat a reviewer will raise: every Ostrem compound is tethered at Cys12, so that paper
    alone cannot separate allosteric coupling from occlusion at the nucleotide-site rim. The
    tether-free demonstration is Kim 2025, doi 10.1016/j.jmb.2025.169162 - non-covalent
    MRTX1133 on G12D, HDX-MS showing stabilisation extending to the P-loop and G-box motifs.
    Genetic confirmation: Weng 2024, doi 10.1038/s41586-023-06954-0, deep mutational scanning
    finds 71 mutations in 9 sotorasib-contact residues that allosterically inhibit RAF1
    binding.

_kras_blind: &kras_blind
  value: false
  why: >
    ASBench curates the HRAS helix-3/loop-7 site (AS001013301, 4DLR) whose residues
    68/95/96/99 are 4 of 5 in our label set, and no predictor's 30-40 % identity dedup
    separates KRAS from HRAS. Helix-3/loop-7 is a DIFFERENT pocket from the S-IIP, so this
    is a residue-overlap leak and not a same-site one - enough to void a blind claim without
    being enough to call the site itself curated.
    Separately, Eren 2021 ran GNM+ANM (no MD) on 4OBE ITSELF, treating the alpha3-L7 site as
    KNOWN and computing allosteric paths to it. The paper does not predict the site, which
    for blindness is worse rather than better: our exact apo input is a published worked
    example. That lobe spans 86-105 and contains 5 of our labels.

_abl1_evidence: &abl1_evidence
  doi: 10.1038/nature08675
  assay: >
    Zhang 2010, the cleanest case in the set: "GNF-2 binds to the myristate-binding site of
    Abl, leading to changes in the structural dynamics of the ATP-binding site". Which assay
    carries which half matters, because the four techniques are not four independent
    demonstrations. NMR, crystallography and mutagenesis localise the BINDING (NMR is
    explicitly negative at the far end - "No significant chemical shift perturbations ... for
    the ATP pocket"). The COUPLING rests on HX-MS alone: peptides 306-316 and 317-324 change
    on GNF-5 binding, and do not change with the non-binding E505K myristate mutant. A
    site-resolved measurement with a binding-null control - the only target in the set that
    has one. Non-competitive kinetics: Adrian 2006, doi 10.1038/nchembio760.

_abl1_blind: &abl1_blind
  value: false
  why: >
    ASD curates this pocket twice (AS001006501/3PYY activator, AS002023501/3K5V inhibitor),
    so every ASD-trained method has seen it. It is also an APOP case study (pocket ranked
    3 of 14) and an ESSA case study - the two leading ENM methods, which is the comparison
    class that matters most to us. The 3PYY record lists 1OPL/MYR as a related complex, so
    the mandated apo is itself in ASD.

_myh7_evidence: &myh7_evidence
  doi: 10.1073/pnas.1720342115
  assay: >
    A TWO-PAPER CHAIN, and it has to be stated as one: no single paper both localises
    mavacamten and shows it acts allosterically.
    (1) Rohde 2018 shows the MOLECULE is an allosteric inhibitor - transient biochemical and
    structural kinetics: actin-activated ATPase k_cat 2.02 -> 0.48 /s, ADP release
    autoinhibited, actin-induced lever-arm rotation slowed 11.5 -> 4.9 /s. It performs no
    structural localisation and names no pocket; the mavacamten structures did not exist
    until 2023-24.
    (2) Auguin 2024, doi 10.1038/s41467-024-47587-9, places it in THIS pocket, and shows
    omecamtiv mecarbil occupying the same pocket with the OPPOSITE functional sign. One site
    driving activity in both directions is strong evidence that it is regulatory rather than
    merely a cavity.
    Quote Rohde's SINGLE-HEADED result, not its headline. The headline mechanism is an
    inter-head, two-headed autoinhibited state, and this arm models ONE chain, so a mechanism
    requiring two heads is partly outside the modelled system. Mavacamten also inhibits S1
    (actin-activated ATPase EC50 0.41 +/- 0.02 uM; basal single-ATP turnover slowed "in both
    HMM and S1"), which is intramolecular coupling within one head and is what a single-chain
    elastic network can represent.

_myh7_blind: &myh7_blind
  value: false
  why: >
    Challenge reference [1] (Zheng 2023, doi 10.1063/5.0141630) reports TWO myosin sites. The
    second: "we also found another site at the N-terminal/converter subdomain interface,
    which may provide targets for other allosteric agents", with ESSA giving residues
    120 121 688 693 694 in Dictyostelium myosin II numbering. Auguin 2024 places the
    mavacamten pocket "between the N-terminal (N-term) and the Converter subdomains" - the
    same interface. Settled by alignment rather than by wording: 1MMA<->MYH7 pairs 673
    residues at 52 % identity, carrying those five onto MYH7 119, 120, 705, 710, 711, of
    which 710 and 711 are frozen labels here. Zheng did not name it as the mavacamten site,
    which makes it a blind prediction of this pocket published in the challenge's own
    bibliography - the strongest possible prior art against a blind claim.
    What survives is narrower: the scoped review retrieved no method run on MYH7 itself
    (Zheng and ESSA ran on Dictyostelium myosin II). That is a search result, not proof of
    absence. This is the arm with the WEAKEST prior art, not a blind one, and Zheng's result
    is a bar to clear rather than an absence to exploit.

# ---------------------------------------------------------------------------------------

# Clause (xii) resolves against three moving databases, so the releases it was decided
# against are pinned here. Added 2026-09-03 by ADR 0042 consequence 1. Every `pfam` value
# below came from RCSB, whose annotations carry `assignment_version: "34.0"`, so the
# recorded families are Pfam 34.0 in fact; the verdict was re-measured live against the
# releases named here and did not move. These fields move no frozen value: `freeze()`
# builds `frozen.json` from six named keys and echoes no other, and `allo.inputs.load`
# rebuilds from an allow-list, so a field added here is redacted from the prediction path
# by default.
interpro_release: "109.0"
pfam_release: "38.2"
panther_release: "19.0"

targets:
  # ------------------------------------------------------- Oncology 1: KRAS G12C
  - id: kras_g12c_mandated
    tier: mandated
    protein: KRAS
    site: Switch-II pocket (S-IIP)
    pfam: [PF00071]
    uniprot: P01116
    apo:
      {
        pdb: 4OBE,
        chain: A,
        sha256: bc5738721380320d37c216a8f4412ddd3f66fad375c60fc0d0626bc6c277e5d7,
      }
    holo: { pdb: 6OIM, chain: A, ligand: MOV }
    allosteric_evidence: *kras_evidence
    state: { apo: GDP-bound inactive, holo: GDP-bound inactive, matched: true }
    blind: *kras_blind
    active_site: { from_ligands: [GDP, MG] }
    defect: >
      Apo is WILD-TYPE KRAS (Gly12); holo is G12C plus C51S/C80L/C118S. Verified from the
      deposited files: 4OBE:A residue 12 is GLY, 6OIM:A residue 12 is CYS. The effector MOV
      is covalently bonded to that cysteine, so the mandated apo lacks the residue the
      mandated holo's ligand is attached to. One residue of 21 labels; the S-IIP itself is
      present in both. Recorded, not repaired - `kras_g12c_corrected` repairs it.

  - id: kras_g12c_corrected
    tier: corrected
    protein: KRAS
    site: Switch-II pocket (S-IIP)
    pfam: [PF00071]
    uniprot: P01116
    apo:
      {
        pdb: 4LDJ,
        chain: A,
        sha256: 4315c16c13a29ad80752637725e046f233f44b26fc3fb58067d9c24f50eb4152,
      }
    holo: { pdb: 6OIM, chain: A, ligand: MOV }
    allosteric_evidence: *kras_evidence
    state: { apo: GDP-bound inactive, holo: GDP-bound inactive, matched: true }
    blind: *kras_blind
    active_site: { from_ligands: [GDP, MG] }
    note: >
      Same study and release date as 4OBE (doi 10.1073/pnas.1404639111), 1.15 A, and actually
      G12C. Changes exactly the one thing the mandated arm gets wrong.

  # ------------------------------------------------------- Oncology 2: BCR-ABL1
  - id: bcr_abl1_mandated
    tier: mandated
    protein: ABL1
    site: myristoyl pocket
    pfam: [PF00017, PF00018, PF07714]
    uniprot: P00519
    apo:
      {
        pdb: 1OPL,
        chain: B,
        sha256: af3a6348cbf0748243503f3aeec85f8cf0fa37a4989696cbfb4afa7424a97f6a,
      }
    holo: { pdb: 5MO4, chain: A, ligand: AY7 }
    allosteric_evidence: *abl1_evidence
    state: { apo: extended, holo: Src-like inactive, matched: false }
    blind: *abl1_blind
    active_site: { from_motifs: [VAIK, HRD, DFG] }
    defect: >
      CHAIN B IS THE ORGANISERS' DESIGNATED INPUT, AND ITS COORDINATES ARE A DOMAIN
      PLACEMENT. On 2026-09-02 the organisers answered that "all non-protein residues and
      ligands must be uniformly stripped" and that they "would suggest teams use Chain B as
      the input, as its native lack of myristate best fulfills the requirement to use the
      unbound apo structure". This arm follows that instruction (ADR 0029). Chain B is the
      only 1OPL chain that passes clause (iii): its nearest ligand heavy atom is 16.0 A from
      the label set.
      Four measured defects print beside every number this arm produces. (1) No SH3 domain is
      modelled. (2) The SH2 domain packs against the N-lobe, not the C-lobe, so the
      autoinhibitory clamp is absent and the mechanism the myristoyl pocket controls is not in
      the model. (3) Ca RMSD to the holo 5MO4:A is 22.89 A over all common residues, against 0.98 A for chain
      A. Read that with its decomposition, independently re-derived: the 22.89 A is ENTIRELY the
      regulatory module, and over the same 239 Ca of the kinase domain alone chain B fits the
      holo at 1.08 A against chain A's 1.00 A. (4)
      The coordinates were not independently refined, and the depositors say so in
      `_refine.details`: "only overall domain B-factors were applied to molecule B, whereas
      individual B-factors were refined for molecule A" - 3 group values against 3041 distinct
      values in chain A. Under C6, which makes contact topology the object the method rests
      on, chain B's residue contacts are properties of 1OPK's geometry plus a domain
      placement. 3 of the 20 labels are unmodelled and are reported as unmapped.
      The chain is also not wild-type sequence: 1OPL carries engineered K29R, E30D, D382N.
      WHY NO BETTER OPTION EXISTS. Chain A was frozen here until 2026-09-02 and is holo at the
      site it is asked to predict: MYR contacts 16 of the 20 labels at 3.29 A, and those 16
      are a strict subset of the asciminib footprint (Jaccard 0.80). An exhaustive RCSB survey
      of every entry modelling more than the ABL kinase domain returns six. All five with the
      clamp docked on the C-lobe have the pocket filled; both with the pocket empty have SH2
      on the N-lobe. The clamp docks only when the pocket is filled, so no myristate-free
      assembled ABL1 exists. 4XEY:B is better coordinates for the same wrong state and was not
      substituted (ADR 0029). This arm is reported and NEVER confirmatory; bcr_abl1_corrected
      (2G2H:A) is where methods are compared.

  - id: bcr_abl1_corrected
    tier: corrected
    protein: ABL1
    site: myristoyl pocket
    pfam: [PF07714]
    uniprot: P00519
    apo:
      {
        pdb: 2G2H,
        chain: A,
        sha256: c0fe887407d0a53dafd6c8fd17a12b4ea12ed5fbf626f0c58eba7a36bfd4888a,
      }
    holo: { pdb: 5MO4, chain: A, ligand: AY7 }
    allosteric_evidence: *abl1_evidence
    state: { apo: Src-like inactive, holo: Src-like inactive, matched: true }
    blind: *abl1_blind
    active_site: { from_motifs: [VAIK, HRD, DFG] }
    note: >
      Myristate-free, same ABL1b numbering as the holo. Measured: its P16 is 16.27 A from the
      label set and contacts none of it, so the pocket is genuinely empty. Two construct facts
      a reviewer will find: the ATP site holds PD166326 (P16), and the chain carries the
      engineered activating mutation H396P in 1a numbering = H415P here, used to trap the
      Src-like inactive state. Kinase domain only, so 2 of the 20 labels (525, 529) fall
      outside the model and are reported as unmapped.
      The NMR ensemble 6XR7 is the only ABL1 kinase domain with BOTH pockets empty and was the
      audit's first choice; 2G2H was taken instead because it is X-ray and uses the holo's
      numbering. 6XR6/6XR7/6XRG remain the ligand-free alternative.

  # ------------------------------------------------------- Cardiology: cardiac myosin
  - id: cardiac_myosin_mandated
    tier: mandated
    protein: MYH7
    site: mavacamten site
    pfam: [PF00063, PF01576, PF02736]
    uniprot: P12883
    apo:
      {
        pdb: 5TBY,
        chain: A,
        sha256: 3d9a579847a11335ecf3b1dc858088ca2c046d7ddfa6fea0943ff17b6b319911,
      }
    # SUBSTITUTED HOLO. CHALLENGE.md Table 1 names 6C1H. The organisers answered on
    # 2026-09-02: "To better represent the human MYH7-mavacamten complex for this challenge,
    # you may substitute 9GZ2 for 6C1H." ADR 0031. The apo is unchanged and is the accession
    # the challenge names.
    holo: { pdb: 9GZ2, chain: A, ligand: XB2 }
    allosteric_evidence: *myh7_evidence
    state:
      {
        apo: unknown (homology model),
        holo: primed/pre-powerstroke ADP-Mg-Pi,
        matched: false,
      }
    blind: *myh7_blind
    assembly_exception: >
      CLAUSE (v) FAILS, DECLARED RATHER THAN REPAIRED. 5TBY deposits the interacting-heads
      motif: assembly 1 is hexameric, with two Myosin-7 heavy chains (A, B), two essential
      light chains (C, D) and two regulatory light chains (E, F), all Homo sapiens. 9GZ2 is
      monomeric, one Myosin-7 chain. The oligomeric states therefore differ, 6 against 1.
      No repair exists inside this arm. The challenge mandates 5TBY as the input and the
      organisers sanctioned 9GZ2 as the holo, so both members are fixed and neither has a
      matching partner. Every human MYH7-mavacamten complex in the PDB is a single head.
      What the method actually receives is one chain: the node set is chain A alone
      (ADR 0010), so five of the six modelled chains are outside the system either way, and
      the two heavy chains are copies of the same entity. The mismatch is therefore about the
      state 5TBY models, not about the residues a method sees.
      It is not cosmetic. The IHM is the super-relaxed state the challenge's own wording names,
      and the blocked head's actin-binding interface is occluded by the free head. A contact
      graph over chain A alone cannot carry that, so this arm models the SRX assembly's single
      head without its partner. cardiac_myosin_corrected (9GZ3 -> 9GZ2) is monomer to monomer
      and has no such gap. Whether the network should be one head or the whole IHM is a
      coarse-graining decision and belongs to Phase 4, not to the input layer.
      Selected chain entity copies: apo 2, holo 1.
    # The holo accession CHALLENGE.md Table 1 names. Kept as a field because the organisers
    # asked that every substitution be documented; `holo:` above is what the arm uses.
    substituted_from:
      holo: 6C1H
      reason: >
        6C1H is bovine cardiac myosin S1 with no mavacamten bound, so it supplies no label
        set for the human MYH7 mavacamten site. The organisers answered on 2026-09-02: "To
        better represent the human MYH7-mavacamten complex for this challenge, you may
        substitute 9GZ2 for 6C1H." ADR 0031.
    # 5TBY has zero heteroatoms, so no ligand-derived source exists. The family motif triple
    # is validated against the ligand-derived source on the two entries where that truth
    # exists: Jaccard 0.483 on 9GZ3:A and 0.516 on 9GZ2:A, centroid offset 5.96 and 5.92 A.
    # ADR 0031. Each of the three matches exactly once in MYH7 and zero times in KRAS or ABL1.
    active_site: { from_motifs: [MYO_PLOOP, MYO_SWITCH1, MYO_SWITCH2] }
    defect: >
      THE APO IS A 20 A HOMOLOGY MODEL, AND ITS CONTACT GRAPH IS LARGELY INVENTED. The holo
      half of the challenge's assignment was wrong and the organisers have replaced it; the
      input half is unchanged and is what this defect is about.
      Input: 5TBY is titled "... OBTAINED BY HOMOLOGY MODELING (USING SWISS-MODEL) OF HUMAN
      SEQUENCE FROM APHONOPELMA HOMOLOGY MODEL (PDB-3JBH), RIGIDLY FITTED TO ... 3D
      RECONSTRUCTION (EMD-2240)", deposited as electron microscopy at 20.00 A with 954
      modelled residues in chain A and ZERO heteroatoms. Do not say "not an experimental
      structure": RCSB reports structure_determination_methodology = experimental, and 5TBY
      is a released PDB entry at version 1.9. Say what is measurable instead. Its only
      em_software MODEL FITTING entry is "UCSF Chimera" (the category has 13 rows naming three
      packages in all, so do not say it is the only entry), it carries no refine block, and
      _struct_conn holds 41 covale records at physically impossible distances (for example
      A/GLN454.CG - B/TYR410.CE2 at 1.083 A), which are auto-annotated interpenetrations
      rather than chemistry.
      MEASURED, against the 3.4 A cryo-EM 9GZ3 over 761 shared residues at the frozen 4.5 A
      cutoff: the long-range contact graph (|i-j| >= 5) agrees at Jaccard 0.471 and recovers
      56.9 % of measured edges, so 43 % of the measured long-range contacts are missing and
      27 % of those present were never measured. Pairwise Ca distances agree at Spearman
      0.9724. The fold is right and the graph is not, and under C6 the graph is the object the
      method rests on. Print both agreement numbers beside every result from this arm.
      TWO SUBSTITUTIONS, BOTH DOCUMENTED. 6C1H -> 9GZ2 here, sanctioned by the organisers;
      5TBY -> 9GZ3 in cardiac_myosin_corrected, which is the arm with measured topology and a
      ligand-derived source. 6C1H is titled "High-Resolution Cryo-EM Structures of Actin-bound
      Myosin States ...", 3.9 A, and its polymer entities are alpha skeletal muscle actin
      (x5), UNCONVENTIONAL MYOSIN-IB (x1) and calmodulin (x1); its only heteroatoms are ADP
      and MG. It contains no mavacamten and no cardiac myosin (Mentes 2018,
      doi 10.1073/pnas.1718316115).
      This arm is reported and NEVER confirmatory. ADR 0031 supersedes ADR 0016.

