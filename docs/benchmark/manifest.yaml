  - id: cardiac_myosin_site1_omecamtiv
    # ADR 0013, accepted: 8QYP was chosen after comparing apo candidates to holo-defined
    # pocket geometry, so this arm's difficulty is answer-informed and anti-conservative.
    # Frozen and reported, but withheld from confirmatory and robustness claims.
    quarantine: answer-informed apo selection (ADR 0013)
    tier: sensitivity
    protein: MYH7
    site: mavacamten/omecamtiv pocket (Site 1)
    site_id: myh7_site1
    apo:  {pdb: 8QYP, chain: A, sha256: 304400a2176723668262aeb67b1c8dc314cbff2f03f820ae6d766a3a1216f20f}
    holo: {pdb: 8QYU, chain: A, ligand: 2OW}
    active_site: {from_ligands: [ADP, VO4, MG]}
    allosteric_evidence:
      doi: 10.1038/s41467-024-47587-9
      assay: >
        Auguin 2024. Omecamtiv mecarbil is an activator and mavacamten an inhibitor, and
        they occupy the same pocket - ligand centroids 2.3 A apart, measured in
        evidence/myosin-structural-landscape.md section 3. One site driving activity in
        both directions is the strongest structural evidence available that it is
        regulatory rather than merely a cavity that binds things.
    state: {apo: pre-powerstroke ADP-VO4, holo: pre-powerstroke ADP-VO4, matched: true}
    blind:
      value: false
      why: >
        Site 1 again, so the same reasoning as the other site1 arms applies - including the
        2026-08-20 correction: Zheng 2023 (challenge reference [1]) blind-predicted this
        pocket on Dictyostelium myosin II, and ESSA's residues map onto MYH7 119/120/705/710/711.
    note: >
      Not a second target: under ADR 0008 a target is a site, and this is Site 1 again.
      It is a one-variable sensitivity arm on the same apo as site1_sensitivity_xray -
      same structure, same pocket, different effector - answering how much the ground
      truth depends on which drug happened to crystallise (an 18-residue 2OW footprint
      against the 15-residue XB2 one). Supersedes 5N6A -> 5N69, the same experiment at
      worse resolution (2.45 A against 1.96 A).

  - id: cardiac_myosin_site2_corrected
    # ADR 0013, accepted: 8QYP was chosen after comparing apo candidates to holo-defined
    # pocket geometry, so this arm's difficulty is answer-informed and anti-conservative.
    # Frozen and reported, but withheld from confirmatory and robustness claims.
    quarantine: answer-informed apo selection (ADR 0013)
    tier: corrected
    protein: MYH7
    site: blebbistatin/aficamten pocket (Site 2)
    site_id: myh7_site2
    apo:  {pdb: 8QYP, chain: A, sha256: 304400a2176723668262aeb67b1c8dc314cbff2f03f820ae6d766a3a1216f20f}
    holo: {pdb: 9F6C, chain: A, ligand: 6I6}
    active_site: {from_ligands: [ADP, VO4, MG]}
    allosteric_evidence:
      doi: 10.1038/s44161-024-00505-0
      assay: >
        Hartman 2024 (Chuang is 4th of 20 authors; cited as "Chuang 2024" in an earlier
        draft): aficamten binds "an allosteric site on the myosin catalytic domain distinct
        from mavacamten" - confirmed here at 34.2 A between ligand centroids. Not
        nucleotide-competitive, and the negative control is explicit: aficamten "did not
        alter ATP binding or hydrolysis as measured by intrinsic tryptophan fluorescence",
        while "actin-activated phosphate release was dramatically slowed". Binding away from
        the nucleotide site changes the rate of a catalytic step - category (b) evidence.
    state: {apo: pre-powerstroke ADP-VO4, holo: pre-powerstroke ADP-VO4, matched: true}
    blind:
      value: false
      why: >
        Challenge reference [1] (Zheng 2023) tests this pocket - 1MMA -> 1YV3, the
        blebbistatin site, 1.4 A from aficamten's. That makes this arm a calibration
        point rather than a blind claim: a method that cannot reach Zheng's result on
        the pocket Zheng tested has not earned a blind claim on Site 1.
    note: >
      A second target on the same protein per ADR 0008, sharing the apo input with the
      site1 arms and differing only in holo and labels. Not from the same study as its
      apo (Hartman 2024 deposited none), the one clause it does not meet cleanly; 8QYP is
      the closest matched frame available, 1.02 A all / 0.33 A core.
      WARNING, and it is why this arm exists: this pocket ABUTS the active site. Label to
      active-site Ca distances run 0.0-15.7 A, median 8.4 A, and 3 of the 21 lining
      residues ARE active-site residues under the frozen rule, so they leave the
      scoreable set. Compare mavacamten on the same apo frame: 17.5-38.5 A, zero overlap.
      A score defined as connectivity to the active site will rank this site highly for
      trivial reasons - which is exactly what it is here to detect. Roughly 30 % of
      catalogued allosteric sites overlap or border the catalytic site (CASBench), and
      without this arm the benchmark cannot tell "predicts allostery" from "predicts
      distance". Interpretable only against the distance-matched null (ADR 0007).
