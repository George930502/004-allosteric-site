# Every sampling and scoring choice for the matched-patch null is frozen here before a
# method is run. Section 5 defines each field and its calibration criterion.
"null":
  graph: {atom_selection: heavy, contact_cutoff_angstrom: 4.5}
  surface_rule: {statistic: contact_degree, maximum_quantile: 0.5}
  # Median and minimum do not constrain how much mass lies near the source. The lower
  # quartile is pinned too. These three summaries constrain centre, nearest approach and the
  # lower tail; they do not determine the full distance distribution.
  distance_statistics:
    - {statistic: median_min_ca_distance_to_active_site, tolerance_angstrom: 1.0}
    - {statistic: minimum_min_ca_distance_to_active_site, tolerance_angstrom: 1.0}
    - {statistic: q25_min_ca_distance_to_active_site, tolerance_angstrom: 1.0}
  growth_algorithm: uniform_contact_frontier
  replicates: 10000
  seed: 0
  p_value: {tail: greater_equal, plus_one_correction: true}
  calibration:
    alpha: 0.05
    independent_replicates: 1000
    prediction_interval_coverage: 0.95

# Only members of state_components can change the catalytic-state match. Additives are
# recorded separately. Every unclassified component touching a mapped active-site residue
# makes the freeze fail, so extending this vocabulary is a visible protocol change.
orthosteric_vocabulary:
  state_components: ["112", ADP, BEF, GDP, MG, NIL, P16, PO4, VO4]
  additives: [DMS, SO4]

targets:

  # ---------------------------------------------------------------- KRAS G12C
  - id: kras_g12c_mandated
    tier: mandated
    protein: KRAS
    site: Switch-II pocket (S-IIP)
    site_id: kras_switch_ii
    apo:  {pdb: 4OBE, chain: A, sha256: bc5738721380320d37c216a8f4412ddd3f66fad375c60fc0d0626bc6c277e5d7}
    holo: {pdb: 6OIM, chain: A, ligand: MOV}
    allosteric_evidence:
      doi: 10.1038/nature12796
      assay: >
        Ostrem 2013. Covalent S-IIP binding subverts native nucleotide preference
        (GTP->GDP, mant-dGDP competition) and impairs Raf binding (co-IP in two G12C lung
        lines) - a functional change at the nucleotide site and at the effector interface,
        driven from a pocket the compound body does not share with either. NOT described here
        as "distal": 5 of the 21 labels are active-site residues at 0.0 A, so distance is the
        wrong argument for this target and the repo's own geometry contradicts it.
        Caveat a reviewer will raise: every Ostrem compound is tethered at Cys12, so that
        paper alone cannot separate allosteric coupling from occlusion at the nucleotide-site
        rim. The tether-free demonstration is Kim 2025, doi 10.1016/j.jmb.2025.169162 -
        non-covalent MRTX1133 on G12D, HDX-MS showing stabilisation extending to the P-loop
        and G-box motifs, "allosterically freezes the KRAS-G12D nucleotide-binding site".
    state: {apo: GDP-bound inactive, holo: GDP-bound inactive, matched: true}
    blind:
      value: false
      why: >
        ASBench curates the HRAS helix-3/loop-7 site (AS001013301, 4DLR) whose residues
        68/95/96/99 are 4 of 5 in our label set, and no predictor's 30-40 % identity dedup
        separates KRAS from HRAS. Stated precisely, because the strength of the argument
        depends on it: helix-3/loop-7 is a DIFFERENT pocket from the S-IIP. This is a
        residue-overlap leak, not a same-site one - an ASD-trained method has been rewarded
        for scoring 4 of our label residues highly on a homologue, which is enough to void a
        blind claim without being enough to call the site itself curated.
        Separately, Eren 2021 ran GNM+ANM (no MD) on 4OBE ITSELF. Note the verb: Eren treats
        the alpha3-L7 site as KNOWN and computes allosteric paths to it - the paper does not
        predict it. An earlier draft said "localised", which overstates it. For blindness that
        is worse, not better: our exact apo input is a published worked example. The lobe Eren
        works with is alpha3-L7 at 86-105, which contains 5 of our labels.
    active_site: {from_ligands: [GDP, MG]}
    defect: apo is WILD-TYPE KRAS (Gly12), holo is G12C plus C51S/C80L/C118S

