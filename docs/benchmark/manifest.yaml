  # ---------------------------------------------------------------- BCR-ABL1
  - id: bcr_abl1_mandated
    tier: mandated
    protein: ABL1
    site: myristoyl pocket
    site_id: abl1_myristoyl
    apo:  {pdb: 1OPL, chain: A, sha256: af3a6348cbf0748243503f3aeec85f8cf0fa37a4989696cbfb4afa7424a97f6a}
    holo: {pdb: 5MO4, chain: A, ligand: AY7}
    allosteric_evidence:
      doi: 10.1038/nature08675
      assay: >
        Zhang 2010, the cleanest case in the set: "GNF-2 binds to the myristate-binding site
        of Abl, leading to changes in the structural dynamics of the ATP-binding site".
        Which assay carries which half matters, because the four techniques are not four
        independent demonstrations. NMR, crystallography and mutagenesis localise the BINDING
        (NMR is explicitly negative at the far end - "No significant chemical shift
        perturbations ... for the ATP pocket"). The COUPLING rests on HX-MS alone: peptides
        306-316 and 317-324 change on GNF-5 binding, and do not change with the non-binding
        E505K myristate mutant. A site-resolved measurement with a binding-null control - the
        only target in the set that has one.
    state: {apo: Src-like inactive, holo: Src-like inactive, matched: true}
    blind:
      value: false
      why: >
        ASD curates this pocket twice (AS001006501/3PYY activator, AS002023501/3K5V
        inhibitor), so every ASD-trained method has seen it. It is also an APOP case study
        (ranked 3 of 14) and an ESSA case study - the two leading ENM methods.
    active_site: {from_motifs: [VAIK, HRD, DFG]}
    defect: >
      Apo carries myristate (MYR) in the target pocket and an ATP-site inhibitor (P16);
      MYR+P16 contact 16 of the 20 distal labels, nearest 3.29 A. Apo and holo are the
      same conformation (1.00 A core, 0.50 A pocket lining). The apo is also not
      wild-type sequence: 1OPL carries engineered K29R, E30D and D382N.

