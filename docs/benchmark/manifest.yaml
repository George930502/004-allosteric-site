  # ---------------------------------------------------------------- cardiac myosin
  - id: cardiac_myosin_site1_mandated
    tier: mandated
    status: excluded
    protein: MYH7
    site: mavacamten site
    site_id: myh7_site1
    apo:  {pdb: 5TBY, chain: A}
    holo: {pdb: 6C1H, chain: P, ligand: null}
    allosteric_evidence:
      doi: 10.1073/pnas.1720342115
      assay: >
        A TWO-PAPER CHAIN, and it has to be stated as one: no single paper both localises
        mavacamten and shows it acts allosterically.
        (1) Rohde 2018 shows the MOLECULE is an allosteric inhibitor - transient biochemical
        and structural kinetics: actin-activated ATPase k_cat 2.02 -> 0.48 /s, ADP release
        autoinhibited, actin-induced lever-arm rotation slowed 11.5 -> 4.9 /s. It performs no
        structural localisation and names no pocket; the mavacamten structures did not exist
        until 2023-24.
        (2) Auguin 2024 (doi 10.1038/s41467-024-47587-9) places it in THIS pocket, and shows
        omecamtiv mecarbil occupying the same pocket with the opposite functional sign - one
        site driving activity in both directions, which is strong structural evidence that it
        is regulatory rather than merely a cavity.
        Quote Rohde's SINGLE-HEADED result, not its headline. Its headline mechanism is an
        inter-head, two-headed autoinhibited state, and every frozen Site 1 arm models ONE
        chain - a mechanism requiring two heads is partly outside the modelled system. But
        mavacamten also inhibits S1 (actin-activated ATPase EC50 0.41 +/- 0.02 uM; basal
        single-ATP turnover slowed "in both HMM and S1"), which is intramolecular coupling
        within one head and is what a single-chain elastic network can represent.
    state: {apo: unknown (homology model), holo: rigor-like actin-bound, matched: false}
    blind:
      value: false
      why: >
        WAS DECLARED BLIND UNTIL 2026-08-20, AND THAT WAS WRONG. The earlier reasoning read
        challenge reference [1] (Zheng 2023, doi 10.1063/5.0141630) as testing only the
        blebbistatin site via 1MMA->1YV3 - our Site 2 - and concluded this pocket was
        untouched. Zheng reports TWO myosin sites. The second: "we also found another site at
        the N-terminal/converter subdomain interface, which may provide targets for other
        allosteric agents", with ESSA giving residues 120 121 688 693 694 in Dictyostelium
        myosin II numbering. Auguin 2024 places the mavacamten pocket "between the N-terminal
        (N-term) and the Converter subdomains" - the same interface.
        Confirmed by alignment rather than by the wording: 1MMA<->MYH7 pairs 673 residues at
        52 % identity, mapping those five onto MYH7 119, 120, 705, 710, 711. Against the
        frozen label set that is 3 of 5 on the 8QYP arm (120, 710, 711; hypergeometric
        E=0.11, P(>=3)=0.0001) and 2 of 5 on the 9GZ3 arm (710, 711; E=0.08, P=0.0022).
        Zheng did not name it as the mavacamten site, which makes it a genuine blind
        prediction of this pocket published in the challenge's own bibliography - the
        strongest possible prior art against a blind claim.
        What survives, and it is still worth stating: no method has been reported on MYH7
        itself. Zheng and ESSA ran on Dictyostelium myosin II. So this is the arm with the
        WEAKEST prior art, not a blind one - and Zheng's result is now a quantitative bar
        rather than an absence. Note also that ASD-proper and CASBench absence was never
        verified (both resist enumeration; only ASBench returns a checkable zero), and ASD's
        Human Allosteric Pocketome ran AlloSitePro over all 20,386 human proteins - MYH7
        included - so predicted sites there are unexamined.
    active_site: {from_ligands: []}
    defect: >
      Unscoreable. 6C1H is rat unconventional myosin-Ib with actin and calmodulin
      (Mentes 2018, doi 10.1073/pnas.1718316115); it contains no mavacamten and no
      cardiac myosin. 5TBY is a 20 A homology model built on a tarantula template
      and rigid-body fitted (Alamo 2017). No label set can be derived.

