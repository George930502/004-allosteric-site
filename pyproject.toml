[project]
name = "allo"
version = "0.1.0"
description = "Quantum simulation of allosteric signal propagation for undruggable targets (Global Quantum + AI Challenge 2026, Cleveland Clinic)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yi-Chun Chang", email = "changg587@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pandas>=2.1",
    "biopython>=1.83",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
]

[project.optional-dependencies]
# Cloud/hardware backends. Kept optional so the core stack installs fast and CI stays offline.
hw = ["amazon-braket-sdk>=1.80", "classiq>=0.60"]
viz = ["py3Dmol>=2.1", "nglview>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
allo = "allo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allo"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Third-party trees we do not own the style of.
extend-exclude = [".claude", "allosteric-benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: runs > 30 s (excluded from the default agent check loop)",
    "network: requires network access (PDB / cloud backends)",
]

[tool.uv]
package = true
