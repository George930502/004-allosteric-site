# Every knob that affects the result belongs here, including the seed.
# A rerun of this config must reproduce metrics.json exactly.
#
#   uv run allo evaluate calibrate experiments/2026-09-02-null-recalibration/config.yaml
#
# Question: at what matching tolerance does the matched-patch permutation test hold its
# size on the frozen arms, does it still reject when the score knows the answer, and what
# effect size can it then detect? ADR 0018 blocks scoring until the first two are measured;
# the third replaces the withdrawn power columns of the draft protocol.
#
# WHY THIS RE-RUN EXISTS. Identical to 2026-08-25-null-calibration except for the arm list.
# The 2026-09-02 input re-freeze changed two arms, so the 2026-08-25 gate is stale for both:
# bcr_abl1_mandated moved from 1OPL chain A to chain B (ADR 0029), which changes its node
# set from 451 residues to 365 and its scoreable label set from 20 to 17; and
# cardiac_myosin_mandated was exposed for the first time (ADR 0031) and has no calibrated
# threshold at all. A threshold measured after a method has been scored is a
# hyperparameter, so both are calibrated here, before any method runs on either arm.
# Every other arm is unchanged and must reproduce its 2026-08-25 value exactly. Any arm
# that does not is a finding, not a rounding difference.
name: null-recalibration
date: 2026-09-02
seed: 0

targets:
  - kras_g12c_mandated
  - kras_g12c_corrected
  - bcr_abl1_mandated
  - bcr_abl1_corrected
  - cardiac_myosin_mandated
  - cardiac_myosin_corrected

# Correlation length of the site-uninformative Gaussian field, in angstrom. The type-I rate
# depends on it, so the gate is required to hold across a range rather than at one value.
# 4 A is about one contact shell; 20 A is a smooth gradient across a small domain.
length_scales: [4.0, 8.0, 12.0, 20.0]

alpha: 0.05
n_fields: 1000

# Size of the confirmatory family, so alpha/3, alpha/2 and alpha are every threshold Holm
# can present. The size ratio is calibrated at all three: a one-parameter rescale fitted at
# alpha alone is wrong at the tighter steps, and the composed procedure then leaks FWER.
holm_family_size: 3

# Stage 1 -- where the tolerance is chosen. Reduced replicates, because this is a sweep.
search:
  tolerances: [0.05, 0.10, 0.20]
  replicates: 999

# Stage 2 -- where the chosen tolerance is verified at the replicate count scoring uses,
# and where each arm's size-calibrated threshold `alpha_star` is measured. The gate runs on
# every frozen arm, not only the five the sweep uses: a threshold measured after a method
# has been scored is a hyperparameter, and the secondary set is where hyperparameters get
# chosen.
gate:
  tolerance: 0.10
  replicates: 9999
  targets:
    - kras_g12c_mandated
    - kras_g12c_corrected
    - bcr_abl1_mandated
    - bcr_abl1_corrected
    - cardiac_myosin_mandated
    - cardiac_myosin_corrected
    - chk1
    - ecoli_cps
    - glucokinase
    - hiv_rt
    - mkp5
    - ns5b
    - p97_vcp
    - ptp1b
    - smyd3

# Stage 3 -- what the verified test can detect. An a priori sensitivity analysis of the
# real procedure, replacing the two closed-form columns the earlier draft withdrew.
power:
  target_power: 0.80
  n_fields: 300
